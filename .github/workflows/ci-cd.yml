name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # STAGE 1: VERIFICATION
  verify:
    name: Quality & Testing
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cnersh_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/cnersh_ci
      BETTER_AUTH_SECRET: test-secret-for-ci
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache TypeScript Compilation State
        uses: actions/cache@v4
        with:
          path: .tsbuildinfo
          key: ${{ runner.os }}-tsconfig-${{ hashFiles('**/tsconfig.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-tsconfig-

      - name: Install Project Dependencies
        run: npm ci

      - name: Synchronize Prisma Engine
        run: npx prisma generate

      - name: Run Database Migrations (test DB)
        run: npx prisma migrate deploy

      - name: Run Code Linters
        run: npm run lint

      - name: Verify TypeScript Compilation
        run: npx tsc --noEmit --incremental --tsBuildInfoFile .tsbuildinfo

      - name: Execute Unit & Integration Tests
        run: npm test -- --ci --coverage

      - name: Archive Code Coverage Metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 5

  # STAGE 2: PRODUCTION DEPLOYMENT
  deploy:
    name: Production Deployment
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    environment:
      name: production
      url: ${{ steps.deploy_execution.outputs.deployment-url }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Fetch Remote Environment Context
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Production Artifacts (with Vercel Remote Cache)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Apply Database Migrations (Production)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Deploy to Vercel (Production)
        id: deploy_execution
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment-url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}